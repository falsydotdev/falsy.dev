name: Daily posters

# Re-renders the poster stills with today's real lighting, then redeploys.
# The posters aren't committed; each run builds and deploys with fresh ones.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/posters/**
      - prototypes/mars-orbit/src/**
      - .github/workflows/posters.yml

concurrency:
  group: posters
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    if: github.event_name != 'schedule' || vars.POSTERS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prototypes/mars-orbit/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: prototypes/mars-orbit
      - id: data-cache
        uses: actions/cache@v4
        with:
          path: prototypes/mars-orbit/public/data
          key: mars-data-${{ hashFiles('prototypes/mars-orbit/scripts/build-data.mjs') }}
      - if: steps.data-cache.outputs.cache-hit != 'true'
        run: npm run data
        working-directory: prototypes/mars-orbit
      - run: npx playwright install --with-deps chromium
      - run: node scripts/posters/render.mjs --webgl --out posters-out
      - run: node scripts/posters/encode.mjs posters-out/frames.json
      - uses: actions/upload-artifact@v4
        with:
          name: posters
          path: |
            posters-out
            src/data/posters.json
          retention-days: 7
      - run: npx astro build
      - if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
